<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Heparina</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.6em;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
    }

    select, input {
      width: 100%;
      font-size: 1.2em;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 2px solid #ccc;
      background: #f9fafb;
    }

    input.activo {
      border-color: #007aff;
      background: #eef5ff;
    }

    button {
      width: 100%;
      margin: 15px 0;
      padding: 14px;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      color: #111;
      font-weight: bold;
    }

    .bloque-calculo {
      display: flex;
      flex-direction: column;
    }

    .nota {
      margin-top: 15px;
      font-size: 0.9em;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

<h1>Calculadora Heparina</h1>

<div class="card">

  <label for="tipo">Concentración</label>
  <select id="tipo" onchange="calcular()">
    <option value="60">30.000 uds / 500 ml (60 uds/ml)</option>
    <option value="200">10.000 uds / 50 ml (200 uds/ml)</option>
  </select>

  <label for="peso">Peso del paciente (kg)</label>
  <input type="number" id="peso" inputmode="decimal" step="0.1">

  <div class="bloque-calculo" id="bloque">

    <div id="bloque-dosis">
      <label for="dosis">Dosis (uds/kg/h)</label>
      <input type="number" id="dosis" inputmode="decimal" step="0.1">
    </div>

    <button type="button" onclick="invertir()">⇅ Invertir cálculo</button>

    <div id="bloque-mlh">
      <label for="mlh">Velocidad (ml/h)</label>
      <input type="number" id="mlh" inputmode="decimal" step="0.1">
    </div>

  </div>

  <div class="nota" id="nota"></div>
  <div class="nota" id="formula"></div>

</div>

<script>
  let modo = "ml"; // ml = calcular ml/h desde dosis

  const pesoInput = document.getElementById("peso");
  const dosisInput = document.getElementById("dosis");
  const mlhInput = document.getElementById("mlh");
  const tipoSelect = document.getElementById("tipo");
  const nota = document.getElementById("nota");
  const formula = document.getElementById("formula");
  const bloque = document.getElementById("bloque");
  const bloqueDosis = document.getElementById("bloque-dosis");
  const bloqueMlh = document.getElementById("bloque-mlh");
  const invertirBtn = bloque.querySelector('button');

  function actualizarModo() {
    dosisInput.classList.remove("activo");
    mlhInput.classList.remove("activo");

    if (modo === "ml") {
      // colocar la casilla de dosis antes del botón y la de ml/h después
      bloque.insertBefore(bloqueDosis, invertirBtn);
      bloque.insertBefore(bloqueMlh, null);
      dosisInput.disabled = false;
      mlhInput.disabled = true;
      dosisInput.classList.add("activo");
      mlhInput.value = "";
      formula.innerText = "Fórmula: velocidad = (peso × dosis) ÷ concentración";
    } else {
      // colocar la casilla de ml/h antes del botón y la de dosis después
      bloque.insertBefore(bloqueMlh, invertirBtn);
      bloque.insertBefore(bloqueDosis, null);
      mlhInput.disabled = false;
      dosisInput.disabled = true;
      mlhInput.classList.add("activo");
      dosisInput.value = "";
      formula.innerText = "Fórmula: dosis = (velocidad × concentración) ÷ peso";
    }
  }

  function invertir() {
    modo = (modo === "ml") ? "dosis" : "ml";
    dosisInput.value = "";
    mlhInput.value = "";
    nota.innerText = "";
    actualizarModo();
  }

  function calcular() {
    const peso = parseFloat(pesoInput.value);
    const tipo = parseFloat(tipoSelect.value);

    if (isNaN(peso) || peso <= 0) return;

    if (modo === "ml") {
      const dosis = parseFloat(dosisInput.value);
      if (isNaN(dosis)) {
        mlhInput.value = "";
        return;
      }
      mlhInput.value = ((peso * dosis) / tipo).toFixed(2);
    } else {
      const mlh = parseFloat(mlhInput.value);
      if (isNaN(mlh)) {
        dosisInput.value = "";
        return;
      }
      dosisInput.value = ((mlh * tipo) / peso).toFixed(2);
    }

    nota.innerText =
      tipo === 60
        ? "Calculado para 30.000 uds en 500 ml."
        : "Calculado para 10.000 uds en 50 ml.";
  }

  dosisInput.addEventListener("input", calcular);
  mlhInput.addEventListener("input", calcular);
  pesoInput.addEventListener("input", calcular);

  actualizarModo();
</script>

</body>
</html>
